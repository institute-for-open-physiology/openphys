name: Mobile parity

on:
  push:
    branches: [main, ios-client]
    paths: ['android/**', 'ios/**', 'shared/**', 'scripts/mobile_contract.py', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['android/**', 'ios/**', 'shared/**', 'scripts/mobile_contract.py', '.github/workflows/mobile.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - name: Check shared contracts
        run: python3 scripts/mobile_contract.py --check
      - name: Test, compare screens, and build
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:koverVerifyDebug --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-review
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/roborazzi/
            android/app/build/reports/
          retention-days: 14
